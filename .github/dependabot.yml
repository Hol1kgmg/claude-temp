version: 2
updates:
  # .github/workflows/ 配下の全 workflow が対象。SHA pin と横の # vN コメントを更新する。
  - package-ecosystem: github-actions
    directory: /
    # 派生側の template-sync（土曜 09:00）より前に終えるため nix と同じ時刻にそろえる
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 2

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 2

  # skill / rules はエージェントの挙動を変えるため、auto-merge せず dependabot-review でレビューする
  - package-ecosystem: apm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 2
