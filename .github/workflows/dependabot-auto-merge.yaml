name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # sync で届く派生リポジトリでは動かさない
    # 人が push した Dependabot ブランチを自動マージしないよう、作成者と実行者の両方で絞る
    if: github.repository == 'Hol1kgmg/claude-temp' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # 書き込み権限を持つため PR のコードは checkout しない。変更ファイルは API で読む
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          if gh api --paginate "repos/$REPO/pulls/$NUMBER/files" -q '.[].filename' | grep -qE '(^|/)apm(\.lock)?\.ya?ml$'; then
            echo "skill / rules の取得元を更新するため手動レビューに回す"
            exit 0
          fi
          # ブランチ保護の必須チェック check が通るまでマージは待たされる
          gh pr merge --auto --squash "$PR"
