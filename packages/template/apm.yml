# テンプレート管理（派生先は ../../apm.yml を編集）。adr/from-template/0007
# skills/ 配下のテンプレート独自 skill は列挙しなくても配置される
name: template
version: 0.0.0
dependencies:
  apm:
    - anthropics/skills/skills/skill-creator
    - anthropics/skills/skills/webapp-testing

    - vercel/ai/skills/adr-skill

    # alias が無いと gist の ID がスキル名になる
    - git: https://gist.github.com/k16shikano/eb2929f13ed19c97188393d297be8432.git
      alias: cognitive-rhythm-writing
    - git: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d.git
      alias: japanese-tech-writing

    - addyosmani/web-quality-skills/skills/web-quality-audit
    - addyosmani/web-quality-skills/skills/performance
    - addyosmani/web-quality-skills/skills/core-web-vitals
    - addyosmani/web-quality-skills/skills/accessibility
    - addyosmani/web-quality-skills/skills/seo
    - addyosmani/web-quality-skills/skills/best-practices

    # skills/yomiyasu を直接指すと .codex-plugin を持つため Codex プラグイン扱いになり、プロジェクト単位で入らない
    - git: https://github.com/nanaism/yomiyasu.git
      skills: [yomiyasu]

    - cloudflare/security-audit-skill/skills/security-audit

    - Hol1kgmg/skills/skills/dependabot-review
    # 必要なリポジトリで ../../apm.yml に足す: Hol1kgmg/skills/skills/speckit-explain

    - Hol1kgmg/rules/rules/orca-worktree.instructions.md
    # 必要なリポジトリで ../../apm.yml に足す: Hol1kgmg/rules/rules/code-comment.instructions.md など
